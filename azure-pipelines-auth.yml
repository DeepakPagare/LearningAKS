trigger:
  branches:
    include:
      - main
  paths:
    include:
      - AuthApi/**
      - azure-pipelines-auth.yml

pool:
  name: Default

variables:
  buildConfiguration: 'Release'
  imageRepository: 'authapi'
  containerRegistry: 'ACR-Connection'
  dockerfilePath: 'AuthApi/Dockerfile'
  tag: '$(Build.BuildId)'

steps:

- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '10.0.x'

- script: |
    dotnet restore AuthApi/AuthApi.csproj
    dotnet build AuthApi/AuthApi.csproj --configuration $(buildConfiguration) --no-restore
  displayName: 'Restore and Build'

- task: Docker@2
  displayName: 'Build and Push Docker Image'
  inputs:
    command: 'buildAndPush'
    containerRegistry: '$(containerRegistry)'
    repository: '$(imageRepository)'
    dockerfile: '$(dockerfilePath)'
    tags: |
      $(tag)
      latest