trigger:
  branches:
    include:
      - main
  paths:
    include:
      - OrderApi/**
      - azure-pipelines-order.yml

pool:
  name: Default

variables:
  buildConfiguration: 'Release'
  imageRepository: 'orderapi'
  containerRegistry: 'ACRConnection'
  dockerfilePath: 'OrderApi/Dockerfile'
  tag: '$(Build.BuildId)'

steps:

- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '10.0.x'

- script: |
    dotnet restore OrderApi/OrderApi.csproj
    dotnet build OrderApi/OrderApi.csproj --configuration $(buildConfiguration) --no-restore
  displayName: 'Restore and Build'

- task: Docker@2
  displayName: 'Build and Push Docker Image'
  inputs:
    command: 'buildAndPush'
    containerRegistry: '$(containerRegistry)'
    repository: '$(imageRepository)'
    dockerfile: '$(dockerfilePath)'
    tags: |
      $(tag)
      latest