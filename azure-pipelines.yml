trigger:
- main

pool:
  name: Default

variables:
  buildConfiguration: Release
  imageRepository: authapi
  dockerfilePath: AuthApi/Dockerfile
  tag: $(Build.BuildId)

steps:

- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '10.0.x'

- script: |
    dotnet restore AuthApi/AuthApi.csproj
    dotnet build AuthApi/AuthApi.csproj --configuration $(buildConfiguration) --no-restore
  displayName: 'Restore and Build'

- task: Docker@2
  displayName: 'Build Docker Image'
  inputs:
    command: build
    repository: $(imageRepository)
    dockerfile: $(dockerfilePath)
    tags: |
      $(tag)
      latest